<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טופס 1008 - גדוד 429</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="card">
    <h1>טופס 1008 פלס"מ - גדוד 429</h1>
    <p class="subtitle">קסדה + שכפ"ץ יומי</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for m in messages %}<p>{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('generate') }}">
      <label for="personal_number">מספר אישי (מ.א.)</label>
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="personal_number" name="personal_number" placeholder="לדוגמה: 7725557" required autocomplete="off">
      <button type="submit">קבל טופס חתום</button>
    </form>

    <p class="hint">שם, דרגה ומ.א. יימולאו אוטומטית מרשימת החטיבה. הטופס נוצר ומורד מיידית.</p>
  </div>
</body>
</html>
